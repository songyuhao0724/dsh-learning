name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      # 不写 version：pnpm/action-setup 会读 package.json 的 packageManager 字段。
      # 两处都写会报 "Multiple versions of pnpm specified"（v0.1.0 的 CI 就是这么红的）。
      # v6 起显式支持 pnpm 11，与根 package.json 的 packageManager 对齐。
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm validate:preset
      # 包之间有 workspace 依赖，先 build 出 .d.ts 才能 typecheck 依赖方
      - run: pnpm build
      - run: pnpm typecheck
      # 测试输出同时落盘：失败时下面那步会把它变成 annotation，
      # 这样不登录 Actions 页面、只读公开 API 也能看到失败的用例名。
      - name: test
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "$RUNNER_TEMP/test.log"
          code=${PIPESTATUS[0]}
          echo "pnpm test exit=$code" | tee -a "$RUNNER_TEMP/test.log"
          exit $code
      - name: 失败时把关键行写成 annotation
        if: failure()
        shell: bash
        run: |
          # GitHub 每个步骤最多展示 10 条 annotation，所以只发两条，把信息压进去。
          # 日志带 ANSI 颜色码（vitest 把 "FAIL " 用转义序列包起来），先剥掉再匹配，
          # 否则 grep 命中不到任何东西，只剩一堆 ✓ 行。
          sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$RUNNER_TEMP/test.log" > "$RUNNER_TEMP/plain.log"
          hits=$(grep -naE '(FAIL |×|AssertionError|Error:|Unhandled|Rejection|Timed out|ELIFECYCLE|Command failed|worker|heap|ENOMEM|EPERM|EBUSY)' "$RUNNER_TEMP/plain.log" | tail -n 20 | paste -sd '|' -)
          hits="${hits:0:3500}"; hits="${hits//'%'/'%25'}"
          echo "::error::关键行（空＝测试全过但进程非零退出）：${hits:-无}"
          tailed=$(tail -n 25 "$RUNNER_TEMP/plain.log" | paste -sd '|' -)
          tailed="${tailed:0:3500}"; tailed="${tailed//'%'/'%25'}"
          echo "::error::日志末尾 25 行：${tailed}"