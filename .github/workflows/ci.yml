name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      # 不写 version：pnpm/action-setup 会读 package.json 的 packageManager 字段。
      # 两处都写会报 "Multiple versions of pnpm specified"（v0.1.0 的 CI 就是这么红的）。
      # v6 起显式支持 pnpm 11，与根 package.json 的 packageManager 对齐。
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm validate:preset
      # 包之间有 workspace 依赖，先 build 出 .d.ts 才能 typecheck 依赖方
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test